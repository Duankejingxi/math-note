<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>高等数学 · 习题1-5</title><style>:root{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;color-scheme:light}*{box-sizing:border-box}body{margin:0;background:#f4f7fc;color:#17233d}.wrap{max-width:780px;margin:auto;padding:22px 16px 80px}header{padding:20px 0}h1{font-size:26px;margin:0 0 7px}p{line-height:1.85}.sub{color:#64748b;font-size:14px}.panel{background:white;border:1px solid #e0e7f0;border-radius:18px;padding:18px;margin:14px 0;box-shadow:0 4px 15px #14203b09}h2{font-size:18px;margin:0 0 14px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}button{font:inherit;cursor:pointer;border:1px solid #cdd8e8;background:white;border-radius:12px;padding:12px 8px;color:#193a6a}button:active{transform:scale(.98)}button.done{background:#e4f6ee;color:#08764d;border-color:#9ed9bb}.actions{display:flex;gap:9px;justify-content:space-between;flex-wrap:wrap}.primary{background:#1e5dc2;color:white;border-color:#1e5dc2}.math{font-size:18px;line-height:1.9;white-space:pre-wrap;overflow-wrap:anywhere}.step{border-left:4px solid #3480d7;padding-left:12px}.step.green{border-color:#16a37a}.step.orange{border-color:#e6a23c}.hidden{display:none}.progress{height:7px;border-radius:8px;background:#dce6f2;overflow:hidden}.bar{height:100%;background:#1eaa7e;width:0}small{color:#66758a}#detail h2{margin-top:8px}@media(max-width:380px){.grid{gap:6px}.grid button{padding:10px 4px;font-size:14px}}</style></head><body><main class="wrap"><header><h1>高等数学 · 习题 1-5</h1><div class="sub">26 道题 · 规范解题 / 逐步理解 / 技巧易错 · 手机适配</div><p class="sub" id="counter">已掌握 0 / 26</p><div class="progress"><div class="bar" id="bar"></div></div></header><section id="catalog"></section><section id="detail" class="hidden"><div class="actions"><button onclick="showCatalog()">← 返回目录</button><small id="position"></small></div><article class="panel"><small>题目</small><h2 id="qid"></h2><div class="math" id="question"></div></article><article class="panel step green"><h2>① 大学生考试标准答案</h2><div class="math" id="answer"></div></article><article class="panel step"><h2>② 零基础讲解</h2><p id="explain"></p></article><article class="panel step orange"><h2>③ 技巧与易错点</h2><p id="tip"></p></article><div class="panel"><label><input type="checkbox" id="mastered" onchange="toggleDone()"> 这道题我已掌握</label></div><div class="actions"><button id="prev" onclick="openQuestion(current-1)">← 上一题</button><button onclick="showCatalog()">目录</button><button id="next" class="primary" onclick="openQuestion(current+1)">下一题 →</button></div></section></main><script>const questions=[["1-1","lim x→2 (x²+5)/(x−3)","(2²+5)/(2−3) = −9","先检查分母：当 x=2 时，x−3=−1，不为零。分式在这个点附近没有断裂，因此可以把 x 直接换成 2。分子算出 2²+5=9，分母为 −1，最后得到 −9。","判断是否能直接代入 → 代入分子 → 代入分母 → 计算商。不要把 x→2 理解成分母趋于 0；这里分母趋于 −1。"],["1-2","lim x→√3 (x²−3)/(x²+1)","(3−3)/(3+1) = 0","把 x=√3 代入时，x²=3，因此分子是 3−3=0，分母是 3+1=4。这里是 0/4，不是 0/0，极限就是零。","分子为零并不可怕，只有分母也为零时才需要进一步变形。√3 的平方是 3，不是 √9 之外的其他值。"],["1-3","lim x→1 (x²−2x+1)/(x²−1)","[(x−1)²]/[(x−1)(x+1)] = (x−1)/(x+1) → 0","第一步代入 x=1 会得到 0/0，这叫未定式，不能写成零。观察分子是完全平方 (x−1)²，分母是平方差 (x−1)(x+1)。在 x≠1 的邻近点，公共因子 x−1 可以约去；再求简化后函数的极限。","0/0 → 因式分解 → 约分 → 再代入。约分只在 x≠1 时成立，但极限不要求函数在 x=1 处有定义。"],["1-4","lim x→0 (4x³−2x²+x)/(3x²+2x)","(4x²−2x+1)/(3x+2) → 1/2","直接代入 x=0 时分子、分母均为 0。先把分子写成 x(4x²−2x+1)，分母写成 x(3x+2)，再约去 x。新分式在 0 处的分母是 2，于是得到 1/2。","碰到多项式的 0/0，先检查能否提出公共 x。不要把分子中的常数项 1 误删。"],["1-5","lim h→0 [(x+h)²−x²]/h","(2xh+h²)/h = 2x+h → 2x","这里求极限的变量是 h，不是 x。展开 (x+h)²=x²+2xh+h²；减去 x² 后剩下 2xh+h²。提出 h 并约去，再让 h 趋于 0，答案为 2x。它也是导数 f′(x) 的定义，其中 f(x)=x²。","关键是区分固定的 x 与变化的 h。平方公式中的交叉项 2xh 不能漏。"],["1-6","lim x→∞ (2−1/x+1/x²)","2−0+0 = 2","x 越来越大时，1/x 越来越接近 0；1/x² 也越来越接近 0。把这两个部分的极限分别代入，常数 2 保留下来。","这类题直接使用 1/xᵏ→0（k>0）。x→∞ 不意味着每一项都趋于无穷大。"],["1-7","lim x→∞ (x²−1)/(2x²−x−1)","(1−1/x²)/(2−1/x−1/x²) → 1/2","把分子、分母都除以 x²，是因为它是两边的最高次数。分子变成 1−1/x²，分母变成 2−1/x−1/x²。所有带 1/x 的项都趋于零，剩下 1/2。","同次多项式之比取最高次项系数之比。不能只把分子除以 x² 而漏掉分母。"],["1-8","lim x→∞ (x²+x)/(x⁴−3x²+1)","(1/x²+1/x³)/(1−3/x²+1/x⁴) → 0","分子最高次为 x²，分母最高次为 x⁴。分子、分母同除以 x⁴ 后，分子各项都趋于 0，而分母趋于 1。因此整个商趋于 0。","分子次数低于分母，极限为 0；若分子次数更高，不能直接套用这个结论。"],["1-9","lim x→4 (x²−6x+8)/(x²−5x+4)","[(x−2)(x−4)]/[(x−1)(x−4)] → (4−2)/(4−1) = 2/3","先代入 x=4，分子、分母都为 0，属于 0/0 型。将分子拆成 (x−2)(x−4)，分母拆成 (x−1)(x−4)。约掉共同的 (x−4)，再代入 4，得到 2/3。","检查因式分解可用展开验算：分母是 x²−5x+4。0/0 不能当成答案。"],["1-10","lim x→∞ (1+1/x)(2−1/x²)","(1+0)(2−0) = 2","第一个括号 1+1/x 趋于 1；第二个括号 2−1/x² 趋于 2。两个极限都有限，直接用极限的乘法法则，得到 1×2=2。","乘法法则的前提是各因子的有限极限存在。这里无需展开两个括号。"],["1-11","lim n→∞ (1+1/2+1/4+⋯+1/2ⁿ)","Sₙ=[1−(1/2)ⁿ⁺¹]/(1−1/2) → 2","这是等比数列求和，不是简单把最后一项当成答案。首项是 1，公比是 1/2，从 2⁰ 到 2ⁿ 共 n+1 项。套用等比求和公式，(1/2)ⁿ⁺¹ 趋于 0，结果为 2。","记住 Sₙ=(1−qⁿ⁺¹)/(1−q)（此处从第 0 项数起）。最常见错误是把 n+1 项误写成 n 项。"],["1-12","lim n→∞ (1+2+⋯+(n−1))/n²","[n(n−1)/2]/n² = (n−1)/(2n) → 1/2","先把分子 1+2+⋯+(n−1) 化成 n(n−1)/2，这是等差求和公式。再除以 n²，整理成 (n−1)/(2n)=(1−1/n)/2。n 趋于无穷大时 1/n→0，得到 1/2。","遇到连续整数求和先化成公式，再看最高次数。不要误用 1+⋯+n 的求和式。"],["1-13","lim n→∞ [(n+1)(n+2)(n+3)]/(5n³)","[(1+1/n)(1+2/n)(1+3/n)]/5 → 1/5","分子有三个一次因子，所以整体最高次数是 n³。把每个括号都写成 n(1+k/n)，三个 n 正好抵消分母的 n³。剩余三个括号都趋于 1，最后除以 5。","不用完全展开三次多项式，逐个提出 n 更快、更不容易出错。"],["1-14","lim x→1 [1/(1−x)−3/(1−x³)]","[(1+x+x²)−3]/(1−x³) = [(x−1)(x+2)]/[−(x−1)(1+x+x²)] → −1","两项分别在 x→1 时都发散，不能直接说无穷减无穷等于 0。先把 1−x³ 分解为 (1−x)(1+x+x²)，再通分。分子化为 x²+x−2=(x−1)(x+2)，分母含有 1−x=−(x−1)。约分后代入，得到 −1。","∞−∞ 是未定式，优先通分。特别注意 1−x=−(x−1)，漏掉负号会算成 +1。"],["2-1","lim x→2 (x³+2x²)/(x−2)²","x²(x+2)/(x−2)² → +∞","当 x→2 时，分子 x³+2x²→16，是正数。分母 (x−2)² 始终非负，且在邻近点为正并趋于 0。正数除以越来越小的正数，结果趋于 +∞。","要判断无穷极限的正负号。平方分母保证从左右两侧接近 2 都是正无穷。"],["2-2","lim x→+∞ x²/(2x+1)","x/(2+1/x) → +∞","分子是二次、分母是一次。把分子分母同除以 x，得到 x/(2+1/x)。当 x→+∞，分子趋于 +∞，分母趋于 2>0，因此商趋于 +∞。","一定看清 x→+∞ 还是 x→−∞；后者本题趋于 −∞。"],["2-3","lim x→+∞ (2x³−x+1)","x³(2−1/x²+1/x³) → +∞","多项式中最高次项 2x³ 的增长速度快于 −x 和常数 1。提出 x³，括号内变为 2−1/x²+1/x³，趋于正数 2。由于 x³→+∞，原式趋于 +∞。","最高次项决定无穷远处的增长趋势，但还要检查最高次项系数和 x 的趋向。"],["3-1","lim x→0 x² sin(1/x)","−x² ≤ x²sin(1/x) ≤ x²，故极限 = 0","sin(1/x) 在 x→0 时不停振荡，自己没有极限。不过正弦函数总满足 −1≤sin(1/x)≤1。乘以非负的 x² 后得到 −x²≤x²sin(1/x)≤x²。两边都趋于 0，夹逼准则说明中间也趋于 0。","看到“趋于 0 的因子 × 有界振荡因子”，优先考虑夹逼准则。不能直接给 sin(1/x) 赋极限。"],["3-2","lim x→+∞ arctan(x)/x","0 < arctan(x)/x < π/(2x) → 0","当 x→+∞，反正切函数 arctan(x) 会趋近 π/2，但始终小于 π/2，且大于 0。因此 0<arctan(x)/x<π/(2x)。右边趋于 0，利用夹逼准则得出极限为 0。","反三角函数要记住值域：arctan(x)∈(−π/2,π/2)。分母为正时才可按当前方向除不等式。"],["4-1","已知 aₙ→0、bₙ→1、cₙ→+∞ 且均非负。判断：aₙ<bₙ 对所有 n 成立","错误。取 aₙ=2/n，bₙ=1，cₙ=n；n=1 时 2>1。","题目说所有正整数 n 都满足 aₙ<bₙ，这个要求比“n 足够大时成立”强。取 aₙ=2/n，bₙ=1，cₙ=n，三个数列非负，且分别趋于 0、1、+∞。但 n=1 时 a₁=2>b₁=1，所以原命题错误。","判断“对所有 n”是否成立，找出一个反例就足够。不要只凭极限大小判断所有项的大小。"],["4-2","同上。判断：bₙ<cₙ 对所有 n 成立","错误。取 aₙ=0，bₙ=1，cₙ=n−1；n=1 时 1>0。","虽然 cₙ→+∞，所以它最终会超过趋于 1 的 bₙ，但这不代表最开始就超过。取 aₙ=0，bₙ=1，cₙ=n−1。n=1 时 c₁=0，b₁=1，违背 bₙ<cₙ。","题目里的“对所有正整数”是关键陷阱。反例要同时满足非负与三个极限条件。"],["4-3","同上。判断：lim(aₙcₙ) 不存在","错误。取 aₙ=1/n，bₙ=1，cₙ=n，则 aₙcₙ=1。","aₙ→0，cₙ→+∞ 时，乘积是 0×∞ 型未定式，无法只靠两个极限判断。取 aₙ=1/n，cₙ=n，乘积恒等于 1，因此极限存在。再取 bₙ=1，所有原条件都满足。","0×∞ 不代表不存在。还可以构造 aₙ=1/n²、cₙ=n，使乘积趋于 0。"],["4-4","同上。判断：lim(bₙcₙ) 不存在","若“存在”指有限实数极限，则正确。bₙ→1、cₙ→+∞，所以 bₙcₙ→+∞。","bₙ→1 意味着从某项开始 bₙ>1/2。因为 cₙ≥0 且 cₙ→+∞，所以 bₙcₙ≥cₙ/2→+∞。因此乘积没有有限实数极限，但具有 +∞ 的无穷极限。","本题容易产生术语争议：若“极限存在”仅指有限极限，命题为真；若把无穷极限也叫存在，必须明确说明其趋于 +∞。"],["5-1","lim f 存在、lim g 不存在，判断 lim(f+g) 不存在","正确。若 lim(f+g) 存在，则 lim g = lim(f+g)−lim f 存在，矛盾。","设 lim f=A（有限），而 lim g 不存在。假设 lim(f+g)=B 也存在，那么 g=(f+g)−f。根据极限减法法则，就有 lim g=B−A，与已知矛盾。所以和的极限不存在。","此题用反证法最快。不要误认为“一个存在、一个不存在”可以直接套加法法则，加法法则本身要求两个有限极限都存在。"],["5-2","lim f、lim g 都不存在，判断 lim(f+g) 不存在","错误。取 f(x)=sin[1/(x−x₀)]，g(x)=−f(x)，则 f+g=0。","“两个都不存在”并不意味着它们的和也不存在。让 f(x)=sin[1/(x−x₀)]，g(x)=−sin[1/(x−x₀)]。当 x→x₀ 时，两个函数都振荡而无极限，但相加恒为 0，所以和的极限存在。","构造反例的核心是“相互抵消”。注意 x₀ 是任意趋近点，不能未经说明直接改成 x→0。"],["5-3","lim f 存在、lim g 不存在，判断 lim(fg) 不存在","错误。取 f(x)=0，g(x)=sin[1/(x−x₀)]，则 fg=0。","取 f(x)≡0，它在 x→x₀ 时极限存在且等于 0。取 g(x)=sin[1/(x−x₀)]，它的极限不存在。然而 f(x)g(x)≡0，乘积极限存在。","乘法极限定理只说两因子的有限极限都存在时可相乘；不能倒推“一个不存在，乘积必不存在”。"]];const groups=[["一、计算极限",0,14],["二、无穷极限",14,17],["三、夹逼准则",17,19],["四、数列判断",19,23],["五、极限性质",23,26]];let current=0;let done=[];try{done=JSON.parse(localStorage.getItem("math-note-done-v1")||"[]")}catch(e){}const el=id=>document.getElementById(id);function update(){el("counter").textContent="已掌握 "+done.length+" / 26";el("bar").style.width=(done.length/26*100)+"%"}function renderCatalog(){el("catalog").innerHTML=groups.map(([title,a,b])=>'<section class="panel"><h2>'+title+'</h2><div class="grid">'+questions.slice(a,b).map((q,j)=>'<button class="'+(done.includes(a+j)?"done":"")+'" onclick="openQuestion('+(a+j)+')">'+q[0]+(done.includes(a+j)?" ✓":"")+'</button>').join("")+'</div></section>').join("");update()}function openQuestion(i){if(i<0||i>=questions.length)return;current=i;let q=questions[i];["qid","question","answer","explain","tip"].forEach((id,j)=>el(id).textContent=q[j]);el("position").textContent=(i+1)+" / 26";el("mastered").checked=done.includes(i);el("prev").disabled=i===0;el("next").disabled=i===25;el("catalog").classList.add("hidden");el("detail").classList.remove("hidden");window.scrollTo(0,0);history.replaceState(null,"","#q"+(i+1))}function showCatalog(){el("detail").classList.add("hidden");el("catalog").classList.remove("hidden");renderCatalog();window.scrollTo(0,0);history.replaceState(null,"",location.pathname)}function toggleDone(){if(el("mastered").checked){if(!done.includes(current))done.push(current)}else done=done.filter(i=>i!==current);try{localStorage.setItem("math-note-done-v1",JSON.stringify(done))}catch(e){}update()}renderCatalog();let match=location.hash.match(/^#q(\d+)$/);if(match)openQuestion(Number(match[1])-1);</script></body></html>
