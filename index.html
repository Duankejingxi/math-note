h1>高等数学 · 习题 1-5</h1><div class="sub">26 道题 · 逐行考试解法 / 详细零基础解析 / 易错辨析</div><p class="sub" id="counter">已掌握 0 / 26</p><div class="progress"><div class="bar" id="bar"></div></div></header><section id="catalog"></section><section id="detail" class="hidden"><div class="actions"><button onclick="showCatalog()">← 返回目录</button><small id="position"></small></div><article class="panel"><small>题目</small><h2 id="qid"></h2><div class="math" id="question"></div></article><article class="panel step green"><h2>① 大学生考试标准答案</h2><div class="math worked" id="answer"></div></article><article class="panel step"><h2>② 零基础讲解</h2><div class="teaching" id="explain"></div></article><article class="panel step orange"><h2>③ 技巧与易错点</h2><div class="teaching" id="tip"></div></article><div class="panel"><label><input type="checkbox" id="mastered" onchange="toggleDone()"> 这道题我已掌握</label></div><div class="actions"><button id="prev" onclick="openQuestion(current-1)">← 上一题</button><button onclick="showCatalog()">目录</button><button id="next" class="primary" onclick="openQuestion(current+1)">下一题 →</button></div></section></main><script>const questions=[["1-1","lim x→2 (x²+5)/(x−3)","检查：x→2，分母 x−3→−1≠0\n因此可用极限的四则运算法则：\nlim (x²+5)/(x−3)\n= [lim(x²+5)]/[lim(x−3)]\n= (2²+5)/(2−3)\n= 9/(−1)\n= −9","【为什么能代入？】多项式在任意实数处连续；分母在目标点不为0，商函数也连续。连续的意思就是“靠近2时，函数值靠近f(2)”。\n【具体操作】①算分母：2−3=−1；②确认不为0；③分别代入分子和分母；④算符号。\n【对比例子】如果题目是(x²−4)/(x−2)，代入会变成0/0，那就不能这样直接算，必须先约分。","快速识别：代入分母≠0 → 直接代入。\n易错：把“x趋于2”误认为“x−3趋于0”；实际上趋于−1。\n验算：x=1.99 时分子约8.9601，分母−1.01，商约−8.87，接近−9。"],["1-2","lim x→√3 (x²−3)/(x²+1)","x→√3 时，x²→3\n分母：x²+1→3+1=4≠0\n原极限\n= [(√3)²−3]/[(√3)²+1]\n= (3−3)/(3+1)\n= 0/4\n= 0","【关键概念】0/4与0/0完全不同。0/4是确定的0；0/0是未定式。\n【一步步看】①目标点是√3；②先算平方，(√3)²=3；③分子恰好抵消为0；④分母为4，所以整个分式趋于0。\n【对比例子】(x²−3)/(x−√3)在x→√3时是0/0，需先把x²−3分解为(x−√3)(x+√3)。","遇到分子→0，先检查分母：非零则结果为0。\n易错：不能把“分子为0”与“未定式”混为一谈。\n检查：分母始终≥1，不可能在实数范围变成0。"],["1-3","lim x→1 (x²−2x+1)/(x²−1)","代入x=1：分子→0，分母→0，属于0/0型。\nx²−2x+1=(x−1)²\nx²−1=(x−1)(x+1)\n所以（x≠1时）\n(x²−2x+1)/(x²−1)\n= (x−1)²/[(x−1)(x+1)]\n= (x−1)/(x+1)\n原极限 = (1−1)/(1+1) = 0","【为什么可以约掉x−1？】极限研究的是x无限接近1时的函数值，不要求x恰好等于1。只要x≠1，就能约掉共同因子。\n【如何找因式】分子是完全平方公式a²−2ab+b²；分母是平方差a²−b²。\n【不要误解】原函数在x=1处分母为0、没有定义，但它的极限仍然可以存在。\n【类比】路上挖掉一个点，靠近那个点时的道路高度仍可能趋于固定值。","流程：先代入判断 → 0/0 → 因式分解 → 约分 → 再代入。\n错误示范：0/0=0 或 0/0=1，均不成立。\n检查：x=1.01时，约分后约0.00498，接近0。"],["1-4","lim x→0 (4x³−2x²+x)/(3x²+2x)","x→0时，分子与分母均趋于0。\n分子=4x³−2x²+x=x(4x²−2x+1)\n分母=3x²+2x=x(3x+2)\n当x≠0时，原式\n= [x(4x²−2x+1)]/[x(3x+2)]\n= (4x²−2x+1)/(3x+2)\n极限=(0−0+1)/(0+2)=1/2","【为什么先提x？】多项式每一项都含有x，说明分子分母共同趋于0可能只是一个可以消掉的公共因子造成的。\n【步骤】①确认0/0；②从分子提出x；③从分母提出x；④约掉x；⑤代入0。\n【知识补充】这里不需要洛必达法则，因式分解更简单。","快速方法：分子分母都有x时先提出x。\n易错：约分后分子常数项1必须保留。\n验算：x=0.001时，原式接近0.499。"],["1-5","lim h→0 [(x+h)²−x²]/h","(x+h)²=x²+2xh+h²\n所以\n[(x+h)²−x²]/h\n= [x²+2xh+h²−x²]/h\n= (2xh+h²)/h\n= 2x+h（h≠0）\n当h→0时，极限=2x","【变量分工】x是固定的一个数，h是不断接近0的“增量”。不要把x也代成0。\n【平方展开】(a+b)²=a²+2ab+b²，因此必须有中间项2xh。\n【为什么这题重要？】它恰好是函数f(x)=x²的导数定义：f′(x)=lim[h→0](f(x+h)−f(x))/h，因此f′(x)=2x。\n【代个数】若x=3，算出的极限就是6，也就是曲线y=x²在x=3处的切线斜率。","识别：出现[f(x+h)−f(x)]/h且h→0，联想到导数定义。\n易错：展开(x+h)²漏掉2xh；把h=0直接代入会出现0/0。\n正确顺序：展开、约分、最后令h→0。"],["1-6","lim x→∞ (2−1/x+1/x²)","当x→∞时：\n1/x→0\n1/x²→0\n由极限加减法则：\nlim(2−1/x+1/x²)\n= 2−lim(1/x)+lim(1/x²)\n= 2−0+0\n= 2","【为什么倒数趋于0？】例如x=10、100、1000时，1/x分别为0.1、0.01、0.001，越来越小。\n【平方倒数】1/x²衰减得更快：0.01、0.0001、0.000001。\n【核心思想】x变大并不代表每个含x的式子都变大，分母里的x越大，分式反而越小。","记忆：对正整数k，x→∞时1/xᵏ→0。\n易错：把1/x²误当成x²。\n无需通分，逐项求极限最直接。"],["1-7","lim x→∞ (x²−1)/(2x²−x−1)","原式=(x²−1)/(2x²−x−1)\n分子分母同除以x²：\n= (1−1/x²)/(2−1/x−1/x²)\n当x→∞：1/x→0，1/x²→0\n因此极限\n= (1−0)/(2−0−0)\n= 1/2","【为什么除以x²？】直接代入会出现∞/∞，这不是一个数。分子分母同除以最高次幂x²，可以把各项转化为常数和趋于0的倒数项。\n【步骤】①找分子最高次数2；②找分母最高次数2；③都除以x²；④令倒数项趋于0。\n【通俗理解】大数情况下，x²−1约等于x²，2x²−x−1约等于2x²，所以比值接近1/2。","同次数有理函数：最高次系数之比。\n易错：分母的−x除以x²是−1/x，不是−1。\n验算：x=100时比值接近0.505。"],["1-8","lim x→∞ (x²+x)/(x⁴−3x²+1)","原式=(x²+x)/(x⁴−3x²+1)\n分子分母同除以x⁴：\n= (1/x²+1/x³)/(1−3/x²+1/x⁴)\n当x→∞时，所有1/xᵏ→0\n所以极限=(0+0)/(1−0+0)=0","【次数比较】分子最高次为2，分母最高次为4。分母增长速度更快，导致比值越来越小。\n【为什么选x⁴？】这是分母的最高次幂，除完后分母保留常数1，不再出现∞/∞。\n【直观例子】x=10时，分子约110，分母约9701，比值只有约0.0113；x更大时比值更小。","次数口诀：分子次数<分母次数 → 极限0；同次 → 系数比。\n易错：只看分子也趋于∞，就误判整个分式趋于∞。"],["1-9","lim x→4 (x²−6x+8)/(x²−5x+4)","代入x=4得0/0，先分解：\nx²−6x+8=(x−2)(x−4)\nx²−5x+4=(x−1)(x−4)\n原式（x≠4）\n= [(x−2)(x−4)]/[(x−1)(x−4)]\n= (x−2)/(x−1)\n原极限=(4−2)/(4−1)=2/3","【如何分解二次式？】找两个数，它们的乘积等于常数项、和等于一次项系数。分子找−2和−4；分母找−1和−4。\n【为什么约分？】分子分母都有(x−4)，这是导致0/0的共同因子，约去后就能直接代入。\n【检查】把两个因式分别展开，确认系数没有写错。","遇到x→a的0/0型，尝试寻找(x−a)因子。\n易错：分母分解成(x+1)(x−4)会给出错误结果；正确是(x−1)(x−4)。"],["1-10","lim x→∞ (1+1/x)(2−1/x²)","第一个因子：lim(1+1/x)=1+0=1\n第二个因子：lim(2−1/x²)=2−0=2\n由乘法法则：\nlim[(1+1/x)(2−1/x²)]\n= [lim(1+1/x)]·[lim(2−1/x²)]\n= 1×2\n= 2","【乘法法则】若两个函数分别趋于有限的A、B，则它们的乘积趋于AB。\n【为什么这里适用？】每个括号都由常数与趋于0的倒数项构成，极限分别存在。\n【操作】不必把括号展开成四项，先分别求两个因子的极限，速度更快。","有限极限相乘可以分别求。\n易错：若某个因子趋于∞，就不能不加判断地照搬有限极限乘法法则。"],["1-11","lim n→∞ (1+1/2+1/4+⋯+1/2ⁿ)","设Sₙ=1+1/2+1/4+⋯+1/2ⁿ\n这是首项a₁=1、公比q=1/2的等比和，共n+1项。\n等比求和公式：\nSₙ=[1−(1/2)ⁿ⁺¹]/[1−1/2]\n=2[1−(1/2)ⁿ⁺¹]\n当n→∞时，(1/2)ⁿ⁺¹→0\n所以lim Sₙ=2","【等比数列是什么？】后一项永远是前一项的固定倍数，这里每次乘1/2。\n【为什么和有极限？】每次增加的量越来越小，部分和逐渐靠近2，却不会超过2。\n【验证前几项】1、1.5、1.75、1.875、1.9375……确实靠近2。\n【项数提醒】从2⁰数到2ⁿ，共n+1项。","看到1、1/2、1/4、1/8……立刻想到等比数列。\n易错：公式指数写成n而非n+1；本题最后一项是1/2ⁿ。"],["1-12","lim n→∞ (1+2+⋯+(n−1))/n²","1+2+⋯+(n−1)\n= [(1+n−1)(n−1)]/2\n= n(n−1)/2\n因此原式\n= [n(n−1)/2]/n²\n= (n−1)/(2n)\n= (1−1/n)/2\n当n→∞时，极限=1/2","【等差求和】连续整数的和=（首项+末项）×项数÷2。本题首项1、末项n−1、项数n−1。\n【为什么分母是n²？】分子求和后也含n²，分子分母最高次数相同，因此极限不为0。\n【举例】n=5时分子1+2+3+4=10，公式5×4/2=10。","先求和再求极限。\n易错：误把1+⋯+(n−1)写成n(n+1)/2；正确是n(n−1)/2。"],["1-13","lim n→∞ [(n+1)(n+2)(n+3)]/(5n³)","(n+1)(n+2)(n+3)/(5n³)\n= [n(1+1/n)·n(1+2/n)·n(1+3/n)]/(5n³)\n= [(1+1/n)(1+2/n)(1+3/n)]/5\n当n→∞时，各括号都趋于1\n极限=(1×1×1)/5=1/5","【为什么提n？】三个一次因子相乘，最高次项是n³，正好与分母n³抵消。\n【不展开的好处】如果直接展开，会得到n³+6n²+11n+6，步骤更多；提出n后各个括号都容易求极限。\n【核心方法】把增长最快的n³单独拿出来，其余都是趋于1的小修正。","多个括号相乘，逐个提n最快。\n易错：把(n+1)(n+2)(n+3)误当成n³+6；乘法不能这样分配。"],["1-14","lim x→1 [1/(1−x)−3/(1−x³)]","先分解：1−x³=(1−x)(1+x+x²)\n通分：\n1/(1−x)−3/(1−x³)\n= [(1+x+x²)−3]/[(1−x)(1+x+x²)]\n= (x²+x−2)/[(1−x)(1+x+x²)]\n= [(x−1)(x+2)]/[−(x−1)(1+x+x²)]\n= −(x+2)/(1+x+x²)\n代入x=1：−3/3=−1","【为什么不能分别算？】第一项和第二项各自发散，形成∞−∞型未定式，不能把无穷大当成普通数字相减。\n【关键操作】①立方差分解；②通分；③分子因式分解；④用1−x=−(x−1)处理负号；⑤约分代入。\n【注意】本题最容易错在符号，最后一定有负号。","∞−∞型优先通分。\n重要公式：a³−b³=(a−b)(a²+ab+b²)。\n验算：x=0.99时代入简化式，结果约−1.003。"],["2-1","lim x→2 (x³+2x²)/(x−2)²","分子x³+2x²=x²(x+2)\n当x→2：分子→2²(2+2)=16>0\n分母(x−2)²→0⁺\n因此原式\n= [趋于16的正数]/[趋于0的正数]\n→ +∞","【为什么是正无穷？】分母是平方，无论从2左侧还是右侧接近，都大于0；而分子在2附近接近16，也大于0。\n【数值感受】x=2.1时分母0.01，分子约17.661，商约1766.1；越靠近2，商越大。\n【术语】这表示函数在x=2附近无界增长，不存在有限实数极限。","判断∞的正负必须看分子、分母符号。\n易错：只写“∞”而不说明是+∞；这里左右两侧都趋于+∞。"],["2-2","lim x→+∞ x²/(2x+1)","原式=x²/(2x+1)\n分子分母同除以x（x≠0）：\n= x/(2+1/x)\n当x→+∞时：\nx→+∞，2+1/x→2>0\n因此原式→+∞","【次数法】分子最高次数2，分母最高次数1，分子比分母多一个x的增长量。\n【为什么除以x？】将分母变成接近常数2，便于判断分式增长方向。\n【数值感受】x=100时，原式10000/201≈49.75；x=1000时约499.75，越来越大。","先比较次数，再看最高次系数与x的方向。\n易错：如果题目是x→−∞，本题结果是−∞，不能照抄+∞。"],["2-3","lim x→+∞ (2x³−x+1)","2x³−x+1\n= x³(2−1/x²+1/x³)\n当x→+∞时：\nx³→+∞\n括号→2−0+0=2>0\n所以原式→+∞","【最高次项支配】x³增长比x快得多，常数1更可以忽略，因此整个多项式的趋势由2x³决定。\n【为什么提出x³？】这样能把“增长部分”和“趋于固定值的部分”分开，证明更清楚。\n【对比】若最高次项为−2x³，则x→+∞时整个式子趋于−∞。","多项式求无穷极限：提最高次幂。\n易错：不能因为含有负项−x，就误判结果可能是负无穷。"],["3-1","lim x→0 x² sin(1/x)","任意x≠0，均有\n−1≤sin(1/x)≤1\n因为x²≥0，同乘x²得\n−x²≤x²sin(1/x)≤x²\n而lim[x→0](−x²)=0\nlim[x→0]x²=0\n根据夹逼准则：\nlim[x→0]x²sin(1/x)=0","【为什么sin(1/x)本身没有极限？】x靠近0时，1/x绝对值越来越大，正弦会不断上下振荡。\n【为什么乘x²就行？】振荡的幅度最多是x²，而x²越来越接近0，所以整个表达式也被压向0。\n【夹逼准则】如果A(x)≤B(x)≤C(x)，且A、C都趋于同一个L，则B也趋于L。\n【图像想象】两条曲线y=±x²形成越来越窄的通道，振荡曲线被关在中间。","一眼识别“无穷小×有界振荡函数”。\n错误：写lim sin(1/x)=0，这个极限根本不存在。\n正确：只对整体使用夹逼。"],["3-2","lim x→+∞ arctan(x)/x","当x>0时，反正切满足\n0<arctan(x)<π/2\n各项同除以正数x：\n0<arctan(x)/x<π/(2x)\n当x→+∞时：\nlim 0=0，lim π/(2x)=0\n由夹逼准则：\nlim arctan(x)/x=0","【反正切是什么？】arctan(x)表示“正切值为x的角”，主值始终落在−π/2与π/2之间。\n【为什么用夹逼？】分子被π/2限制住，不会无限增大；分母x却越来越大，商必趋于0。\n【对比】如果分子是x²而不是arctan(x)，分式就不会趋于0，因为x²并不有界。","识别有界分子/无界正分母 → 夹逼到0。\n易错：不说明x>0就直接除不等式；这里x→+∞保证最终为正。"],["4-1","已知 aₙ→0、bₙ→1、cₙ→+∞ 且均非负。判断：aₙ<bₙ 对所有 n 成立","命题：对每个正整数n，均有aₙ<bₙ。\n构造：aₙ=2/n，bₙ=1，cₙ=n。\n验证极限：\nlim aₙ=0，lim bₙ=1，lim cₙ=+∞。\n验证非负：n≥1时三者均≥0。\n但n=1时：a₁=2，b₁=1，a₁<b₁不成立。\n因此命题错误。","【命题中的陷阱】aₙ趋于0、bₙ趋于1，的确说明“足够大的n”时aₙ<bₙ；但题目要求“所有n”，包括n=1。\n【反例怎么找？】保留极限不变，只要让前面某一项违反即可。aₙ=2/n趋于0，却在第一项大于1。\n【逻辑】一个“对所有”的命题，只要找出一个不满足的例子，就能推翻。","做数列判断先圈出“∀n”或“充分大n”。\n反例需逐一核验：非负、三个极限、至少一项违反。"],["4-2","同上。判断：bₙ<cₙ 对所有 n 成立","命题：对每个正整数n，均有bₙ<cₙ。\n构造：aₙ=0，bₙ=1，cₙ=n−1。\n验证：aₙ→0，bₙ→1，cₙ→+∞。\nn≥1时三者非负。\n但n=1时：b₁=1，c₁=0，故b₁<c₁不成立。\n因此命题错误。","【为什么这个反例有效？】cₙ=n−1虽然最终越来越大，但它第一项等于0。极限只看n趋于无穷时的行为，前面有限项不影响极限。\n【一般方法】若题目声称“所有n都成立”，可优先尝试让n=1失败。\n【注意】本题要求cₙ非负，因此选n−1合适；选n−2则第一项为−1，不满足条件。","反例必须满足所有前提，不是随便写一个不等式失败的数列。\n尤其注意“非负数列”的限制。"],["4-3","同上。判断：lim(aₙcₙ) 不存在","命题：lim(aₙcₙ)不存在。\n构造：aₙ=1/n，bₙ=1，cₙ=n。\n三个数列非负，且\nlim aₙ=0，lim bₙ=1，lim cₙ=+∞。\n但aₙcₙ=(1/n)·n=1，\n所以lim(aₙcₙ)=1存在。\n故命题错误。","【0×∞为什么是未定式？】一个因子趋于0、另一个趋于∞，要看它们变化速度谁更快。\n【三种对比】aₙ=1/n²、cₙ=n，乘积→0；aₙ=1/n、cₙ=n，乘积→1；aₙ=1/√n、cₙ=n，乘积→+∞。\n【结论】仅凭aₙ→0和cₙ→∞，不能确定乘积极限。","“0×∞”必须化简具体表达式，不可直接判定。\n反例选互为倒数的n与1/n最方便。"],["4-4","同上。判断：lim(bₙcₙ) 不存在","已知bₙ→1，所以存在N₁，使n≥N₁时bₙ>1/2。\n又cₙ≥0且cₙ→+∞。\n因此n≥N₁时\nbₙcₙ ≥ (1/2)cₙ。\n由于(1/2)cₙ→+∞，\n由比较可得bₙcₙ→+∞。\n所以乘积没有有限极限。","【为什么不能只写1×∞？】严格证明要说明bₙ最终保持正值，并且远离0。bₙ→1保证它最终大于1/2。\n【比较思想】如果一个数始终不小于另一个趋于+∞的数，那么它也趋于+∞。\n【术语】教材通常把“有限极限存在”和“趋于无穷大”区分开。题目若说“不存在”，需说明是“不存在有限极限”。","标准结论：正的非零有限极限 × +∞ → +∞。\n易错：把bₙcₙ写成“未定式”，实际上bₙ→1≠0，不是0×∞。"],["5-1","lim f 存在、lim g 不存在，判断 lim(f+g) 不存在","已知lim f(x)=A存在，lim g(x)不存在。\n假设lim[f(x)+g(x)]=B也存在。\n由恒等式\n g(x)=[f(x)+g(x)]−f(x)\n以及有限极限的减法法则：\nlim g(x)=B−A。\n这与lim g(x)不存在矛盾。\n所以lim[f(x)+g(x)]不存在。\n命题正确。","【为什么用反证法？】题目让证明“不存在”，直接计算很困难。假设它存在，就可以利用减法法则推导出已知不存在的g也存在，形成矛盾。\n【逻辑链】和存在 + f存在 ⇒ g=和−f也存在；但已知g不存在，所以“和存在”的假设错误。\n【简单例子】如果一个不断振荡的量加上固定常数，振荡不会凭空消失。","记忆结构：一个有有限极限，另一个没有 → 两者的和没有有限极限。\n注意：这不是直接套加法法则，而是反证。"],["5-2","lim f、lim g 都不存在，判断 lim(f+g) 不存在","命题：若lim f与lim g均不存在，则lim(f+g)也不存在。\n取（x≠x₀）\nf(x)=sin[1/(x−x₀)]\ng(x)=−sin[1/(x−x₀)]。\n当x→x₀时，f与g都振荡而无极限。\n但f(x)+g(x)=0，\n因此lim(f+g)=0存在。\n故命题错误。","【核心想法】两个“坏函数”相加，也可能因为恰好相反而抵消，得到一个“好函数”。\n【为什么sin[1/(x−x₀)]没有极限？】当x靠近x₀时，1/(x−x₀)的绝对值无限增大，正弦不断在−1与1之间振荡。\n【如何构造】先挑一个没有极限的函数f，再令g=−f，它们分别没有极限，但和恒为0。","反例套路：f与−f相加。\n易错：题目是x→x₀，写sin(1/x)只对x₀=0的情况有效。"],["5-3","lim f 存在、lim g 不存在，判断 lim(fg) 不存在","命题：若lim f存在、lim g不存在，则lim(fg)不存在。\n取f(x)≡0，\ng(x)=sin[1/(x−x₀)]（x≠x₀）。\n有lim f(x)=0存在，\nlim g(x)不存在。\n但f(x)g(x)≡0，\n因此lim[f(x)g(x)]=0存在。\n故命题错误。","【为什么可以这样选？】题目只要求f有极限，并没有要求这个极限不为0。最简单的选择就是f恒等于0。\n【g为什么符合条件？】它在x₀附近不断振荡，所以极限不存在。\n【乘积为何有极限？】不管g怎么变化，0×g都等于0。\n【拓展】如果f趋于非零常数而g没有有限极限，则乘积不能有有限极限；本题的关键正是f可以趋于0。","反例优先用最简单的函数：f≡0。\n易错：把“两个有限极限存在时可相乘”反过来用，属于逻辑错误。"]];const groups=[["一、计算极限",0,14],["二、无穷极限",14,17],["三、夹逼准则",17,19],["四、数列判断",19,23],["五、极限性质",23,26]];let current=0;let done=[];try{done=JSON.parse(localStorage.getItem("math-note-done-v1")||"[]")}catch(e){}const el=id=>document.getElementById(id);function update(){el("counter").textContent="已掌握 "+done.length+" / 26";el("bar").style.width=(done.length/26*100)+"%"}function renderCatalog(){el("catalog").innerHTML=groups.map(([title,a,b])=>'<section class="panel"><h2>'+title+'</h2><div class="grid">'+questions.slice(a,b).map((q,j)=>'<button class="'+(done.includes(a+j)?"done":"")+'" onclick="openQuestion('+(a+j)+')">'+q[0]+(done.includes(a+j)?" ✓":"")+'</button>').join("")+'</div></section>').join("");update()}function openQuestion(i){if(i<0||i>=questions.length)return;current=i;let q=questions[i];["qid","question","answer","explain","tip"].forEach((id,j)=>el(id).textContent=q[j]);el("position").textContent=(i+1)+" / 26";el("mastered").checked=done.includes(i);el("prev").disabled=i===0;el("next").disabled=i===25;el("catalog").classList.add("hidden");el("detail").classList.remove("hidden");window.scrollTo(0,0);history.replaceState(null,"","#q"+(i+1))}function showCatalog(){el("detail").classList.add("hidden");el("catalog").classList.remove("hidden");renderCatalog();window.scrollTo(0,0);history.replaceState(null,"",location.pathname)}function toggleDone(){if(el("mastered").checked){if(!done.includes(current))done.push(current)}else done=done.filter(i=>i!==current);try{localStorage.setItem("math-note-done-v1",JSON.stringify(done))}catch(e){}update()}renderCatalog();let match=location.hash.match(/^#q(\d+)$/);if(match)openQuestion(Number(match[1])-1);</script></body></html>
