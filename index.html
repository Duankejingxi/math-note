<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>高等数学 · 习题1-5</title><style>:root{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;color-scheme:light}*{box-sizing:border-box}body{margin:0;background:#f4f7fc;color:#17233d}.wrap{max-width:780px;margin:auto;padding:22px 16px 80px}header{padding:20px 0}h1{font-size:26px;margin:0 0 7px}p{line-height:1.85}.sub{color:#64748b;font-size:14px}.panel{background:white;border:1px solid #e0e7f0;border-radius:18px;padding:18px;margin:14px 0;box-shadow:0 4px 15px #14203b09}h2{font-size:18px;margin:0 0 14px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}button{font:inherit;cursor:pointer;border:1px solid #cdd8e8;background:white;border-radius:12px;padding:12px 8px;color:#193a6a}button:active{transform:scale(.98)}button.done{background:#e4f6ee;color:#08764d;border-color:#9ed9bb}.actions{display:flex;gap:9px;justify-content:space-between;flex-wrap:wrap}.primary{background:#1e5dc2;color:white;border-color:#1e5dc2}.math{font-size:19px;line-height:1.8;white-space:pre-wrap;overflow-wrap:anywhere}.step{border-left:4px solid #3480d7;padding-left:12px}.step.green{border-color:#16a37a}.step.orange{border-color:#e6a23c}.hidden{display:none}.progress{height:7px;border-radius:8px;background:#dce6f2;overflow:hidden}.bar{height:100%;background:#1eaa7e;width:0}small{color:#66758a}#detail h2{margin-top:8px}@media(max-width:380px){.grid{gap:6px}.grid button{padding:10px 4px;font-size:14px}}</style></head><body><main class="wrap"><header><h1>高等数学 · 习题 1-5</h1><div class="sub">26 道题 · 考场答案 / 零基础讲解 / 技巧易错 · 手机适配</div><p class="sub" id="counter">已掌握 0 / 26</p><div class="progress"><div class="bar" id="bar"></div></div></header><section id="catalog"></section><section id="detail" class="hidden"><div class="actions"><button onclick="showCatalog()">← 返回目录</button><small id="position"></small></div><article class="panel"><small>题目</small><h2 id="qid"></h2><div class="math" id="question"></div></article><article class="panel step green"><h2>① 大学生考试标准答案</h2><div class="math" id="answer"></div></article><article class="panel step"><h2>② 零基础讲解</h2><p id="explain"></p></article><article class="panel step orange"><h2>③ 技巧与易错点</h2><p id="tip"></p></article><div class="panel"><label><input type="checkbox" id="mastered" onchange="toggleDone()"> 这道题我已掌握</label></div><div class="actions"><button id="prev" onclick="openQuestion(current-1)">← 上一题</button><button onclick="showCatalog()">目录</button><button id="next" class="primary" onclick="openQuestion(current+1)">下一题 →</button></div></section></main><script>const questions=[["1-1","lim x→2 (x²+5)/(x−3)","(2²+5)/(2−3) = −9","分母在 x=2 时不为 0，可以直接代入。","先代入，只有遇到 0/0 等未定式再变形。"],["1-2","lim x→√3 (x²−3)/(x²+1)","(3−3)/(3+1) = 0","分母趋于 4，直接代入。","分子趋于 0、分母不为 0，极限就是 0。"],["1-3","lim x→1 (x²−2x+1)/(x²−1)","[(x−1)²]/[(x−1)(x+1)] = (x−1)/(x+1) → 0","0/0 型先分解，再约去 x−1。","求极限只考察邻近点，约分不要求在 x=1 处有定义。"],["1-4","lim x→0 (4x³−2x²+x)/(3x²+2x)","(4x²−2x+1)/(3x+2) → 1/2","分子分母提出 x 后约去。","看到共同因子 x 优先约分。"],["1-5","lim h→0 [(x+h)²−x²]/h","(2xh+h²)/h = 2x+h → 2x","x 是常数，h 是趋于 0 的变量。","这是 x² 的导数定义形式。"],["1-6","lim x→∞ (2−1/x+1/x²)","2−0+0 = 2","1/x 与 1/x² 都趋于 0。","无穷远处负次幂项消失。"],["1-7","lim x→∞ (x²−1)/(2x²−x−1)","(1−1/x²)/(2−1/x−1/x²) → 1/2","分子分母同除以 x²。","同次数多项式之比，取最高次项系数之比。"],["1-8","lim x→∞ (x²+x)/(x⁴−3x²+1)","(1/x²+1/x³)/(1−3/x²+1/x⁴) → 0","分母最高次数 4 大于分子最高次数 2。","分母次数更高时极限为 0。"],["1-9","lim x→4 (x²−6x+8)/(x²−5x+4)","[(x−2)(x−4)]/[(x−1)(x−4)] → (4−2)/(4−1) = 2/3","分子分母分别因式分解，约去 x−4。","0/0 型先约分再代入。"],["1-10","lim x→∞ (1+1/x)(2−1/x²)","(1+0)(2−0) = 2","两个因子都有有限极限，直接用乘法法则。","乘积的极限等于极限的乘积（均存在有限极限时）。"],["1-11","lim n→∞ (1+1/2+1/4+⋯+1/2ⁿ)","Sₙ=[1−(1/2)ⁿ⁺¹]/(1−1/2) → 2","这是首项 1、公比 1/2 的等比数列前 n+1 项和。","不要漏掉最后一项 1/2ⁿ。"],["1-12","lim n→∞ (1+2+⋯+(n−1))/n²","[n(n−1)/2]/n² = (n−1)/(2n) → 1/2","用等差数列求和公式。","1 到 n−1 的和为 n(n−1)/2。"],["1-13","lim n→∞ [(n+1)(n+2)(n+3)]/(5n³)","[(1+1/n)(1+2/n)(1+3/n)]/5 → 1/5","分子三个括号各提出 n，约掉 n³。","乘积先提最高次因子。"],["1-14","lim x→1 [1/(1−x)−3/(1−x³)]","[(1+x+x²)−3]/(1−x³) = [(x−1)(x+2)]/[−(x−1)(1+x+x²)] → −1","两个分式分别发散，不能直接相减，必须通分。","1−x³=(1−x)(1+x+x²)。"],["2-1","lim x→2 (x³+2x²)/(x−2)²","x²(x+2)/(x−2)² → +∞","分子趋于 16，分母为趋于 0 的正数。","平方项保证左右两侧都为正。"],["2-2","lim x→+∞ x²/(2x+1)","x/(2+1/x) → +∞","分子增长阶数比分母高一阶。","x→−∞ 时符号不同，注意趋近方向。"],["2-3","lim x→+∞ (2x³−x+1)","x³(2−1/x²+1/x³) → +∞","最高次项 2x³ 决定增长方向。","多项式无穷远处先看最高次项。"],["3-1","lim x→0 x² sin(1/x)","−x² ≤ x²sin(1/x) ≤ x²，故极限 = 0","sin(1/x) 虽振荡，但始终在 −1 和 1 之间。","有界量乘无穷小，常用夹逼准则。"],["3-2","lim x→+∞ arctan(x)/x","0 < arctan(x)/x < π/(2x) → 0","arctan(x) 有界，而 x 无限增大。","反三角函数的有界性可用于夹逼。"],["4-1","已知 aₙ→0、bₙ→1、cₙ→+∞ 且均非负。判断：aₙ<bₙ 对所有 n 成立","错误。取 aₙ=2/n，bₙ=1，cₙ=n；n=1 时 2>1。","极限只决定充分靠后的项，不决定最初几项。","“所有 n”与“充分大的 n”要区分。"],["4-2","同上。判断：bₙ<cₙ 对所有 n 成立","错误。取 aₙ=0，bₙ=1，cₙ=n−1；n=1 时 1>0。","cₙ 虽最终超过 bₙ，但前几项未必满足。","反例只需找到一个违反的 n。"],["4-3","同上。判断：lim(aₙcₙ) 不存在","错误。取 aₙ=1/n，bₙ=1，cₙ=n，则 aₙcₙ=1。","0×∞ 是未定式，乘积可能收敛。","不能把 0×∞ 当成固定结果。"],["4-4","同上。判断：lim(bₙcₙ) 不存在","若“存在”指有限实数极限，则正确。bₙ→1、cₙ→+∞，所以 bₙcₙ→+∞。","因为 bₙ 最终大于 1/2，乘积必趋于正无穷。","注意术语：不存在有限极限，但有无穷极限。"],["5-1","lim f 存在、lim g 不存在，判断 lim(f+g) 不存在","正确。若 lim(f+g) 存在，则 lim g = lim(f+g)−lim f 存在，矛盾。","用反证法，利用有限极限的减法法则。","一个收敛加一个不收敛，和不可能收敛。"],["5-2","lim f、lim g 都不存在，判断 lim(f+g) 不存在","错误。取 f(x)=sin[1/(x−x₀)]，g(x)=−f(x)，则 f+g=0。","两个不收敛的函数可以相互抵消。","构造反例时使用相反数。"],["5-3","lim f 存在、lim g 不存在，判断 lim(fg) 不存在","错误。取 f(x)=0，g(x)=sin[1/(x−x₀)]，则 fg=0。","乘上恒为零的函数后，乘积极限仍为零。","不要把极限乘法法则反过来滥用。"]];const groups=[["一、计算极限",0,14],["二、无穷极限",14,17],["三、夹逼准则",17,19],["四、数列判断",19,23],["五、极限性质",23,26]];let current=0;let done=[];try{done=JSON.parse(localStorage.getItem("math-note-done-v1")||"[]")}catch(e){}const el=id=>document.getElementById(id);function update(){el("counter").textContent="已掌握 "+done.length+" / 26";el("bar").style.width=(done.length/26*100)+"%"}function renderCatalog(){el("catalog").innerHTML=groups.map(([title,a,b])=>'<section class="panel"><h2>'+title+'</h2><div class="grid">'+questions.slice(a,b).map((q,j)=>'<button class="'+(done.includes(a+j)?"done":"")+'" onclick="openQuestion('+(a+j)+')">'+q[0]+(done.includes(a+j)?" ✓":"")+'</button>').join("")+'</div></section>').join("");update()}function openQuestion(i){if(i<0||i>=questions.length)return;current=i;let q=questions[i];["qid","question","answer","explain","tip"].forEach((id,j)=>el(id).textContent=q[j]);el("position").textContent=(i+1)+" / 26";el("mastered").checked=done.includes(i);el("prev").disabled=i===0;el("next").disabled=i===25;el("catalog").classList.add("hidden");el("detail").classList.remove("hidden");window.scrollTo(0,0);history.replaceState(null,"","#q"+(i+1))}function showCatalog(){el("detail").classList.add("hidden");el("catalog").classList.remove("hidden");renderCatalog();window.scrollTo(0,0);history.replaceState(null,"",location.pathname)}function toggleDone(){if(el("mastered").checked){if(!done.includes(current))done.push(current)}else done=done.filter(i=>i!==current);try{localStorage.setItem("math-note-done-v1",JSON.stringify(done))}catch(e){}update()}renderCatalog();let match=location.hash.match(/^#q(\d+)$/);if(match)openQuestion(Number(match[1])-1);</script></body></html>
